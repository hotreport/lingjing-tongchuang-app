name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check protected runtime
        run: npm run check:runtime
      - name: Build static app
        run: |
          npx tsc --noEmit
          npx vite build --base="/${GITHUB_REPOSITORY#*/}/"
          node scripts/prepare-pages-build.mjs
      - name: Publish static app to gh-pages
        run: |
          mkdir -p /tmp/pages-output
          cp -R dist/client/. /tmp/pages-output/
          touch /tmp/pages-output/.nojekyll
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/pages-output/. .
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Deploy interactive prototype"
          git push --force origin gh-pages

