<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">灵境童创品牌标志</title>
  <desc id="desc">由四块彩色模块围绕一颗白色灵感星构成的积木图形，搭配灵境童创中文标准字和把故事搭出来品牌短句。</desc>
  <g transform="translate(36 37)">
    <rect x="0" y="0" width="78" height="78" rx="23" fill="#247D70"/>
    <rect x="90" y="0" width="78" height="78" rx="23" fill="#F1A451"/>
    <rect x="0" y="90" width="78" height="78" rx="23" fill="#5D82C2"/>
    <rect x="90" y="90" width="78" height="78" rx="23" fill="#8BBD94"/>
    <path d="M84 45l13 39-13 39-13-39z" fill="#FFFFFF"/>
    <circle cx="84" cy="84" r="7" fill="#D8EFE6"/>
  </g>
  <text x="255" y="131" fill="#243735" font-size="68" font-weight="750" letter-spacing="5" font-family="Microsoft YaHei, PingFang SC, sans-serif">灵境童创</text>
  <text x="260" y="183" fill="#658078" font-size="25" letter-spacing="5" font-family="Microsoft YaHei, PingFang SC, sans-serif">把故事搭出来</text>
</svg>
